plugins {
    id 'com.android.application'
}

android {
    namespace 'com.eveta.zasqr'
    compileSdk 35

    defaultConfig {
        applicationId "com.eveta.zasqr"
        minSdk 24
        targetSdk 35
        versionCode 10
        versionName "10.0"
    }

    signingConfigs {
        release {
            storeFile     file(System.getenv("KEYSTORE_PATH") ?: "zasqr-release.jks")
            storePassword System.getenv("KEYSTORE_PASS")  ?: "zasqr123"
            keyAlias      System.getenv("KEY_ALIAS")      ?: "zasqr"
            keyPassword   System.getenv("KEY_PASS")       ?: "zasqr123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.zxing:core:3.5.3'
}
