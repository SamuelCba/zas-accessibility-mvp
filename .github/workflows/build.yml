name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Remove Termux-specific aapt2 path
        run: sed -i '/aapt2FromMavenOverride/d' gradle.properties

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > zasqr-release.jks

      - name: Build signed APK
        run: gradle assembleRelease --no-daemon
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/zasqr-release.jks
          KEYSTORE_PASS: zasqr123
          KEY_ALIAS: zasqr
          KEY_PASS: zasqr123

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zas-qrg-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
